<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COSMIC-S</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      overflow: hidden;
      position: relative;
    }

    /* I timbri si sparpagliano ovunque sullo schermo ma leggermente più grandi e ben distribuiti */
    .stamp-sticker {
      position: absolute;
      height: auto;
      z-index: 1;
      pointer-events: none;
      filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.25));
    }

    /* Distribuzione mista: angoli, alto/basso in mezzo, sinistra/destra al centro */
    .stamp-1  { width: 70px; top: 10%; left: 8%; transform: rotate(-12deg); }   /* Angolo alto-sinistra */
    .stamp-2  { width: 78px; top: 6%; left: 45%; transform: rotate(8deg); }    /* In alto in mezzo */
    .stamp-3  { width: 66px; top: 12%; right: 10%; transform: rotate(14deg); }  /* Angolo alto-destra */
    .stamp-4  { width: 82px; top: 44%; left: 4%; transform: rotate(18deg); }    /* A sinistra in centro */
    .stamp-5  { width: 70px; top: 40%; right: 5%; transform: rotate(-15deg); }   /* A destra in centro */
    .stamp-6  { width: 74px; bottom: 10%; left: 9%; transform: rotate(-8deg); }  /* Angolo basso-sinistra */
    .stamp-7  { width: 62px; bottom: 8%; left: 48%; transform: rotate(12deg); }   /* In basso in mezzo */
    .stamp-8  { width: 76px; bottom: 10%; right: 9%; transform: rotate(-10deg); } /* Angolo basso-destra */
    .stamp-9  { width: 68px; top: 25%; left: 12%; transform: rotate(5deg); }    /* Sinistra-alto interno */
    .stamp-10 { width: 74px; top: 28%; right: 13%; transform: rotate(-6deg); }  /* Destra-alto interno */
    .stamp-11 { width: 66px; bottom: 28%; left: 14%; transform: rotate(-14deg); }/* Sinistra-basso interno */
    .stamp-12 { width: 72px; bottom: 26%; right: 12%; transform: rotate(16deg); }/* Destra-basso interno */
    .stamp-13 { width: 78px; top: 3%; left: 22%; transform: rotate(-4deg); }    /* Tra alto-sinistra e centro */
    .stamp-14 { width: 62px; bottom: 3%; left: 30%; transform: rotate(7deg); }   /* Tra basso-sinistra e centro */
    .stamp-15 { width: 70px; top: 68%; right: 8%; transform: rotate(-11deg); }   /* Tra basso-destra e centro */

    /* Contenitore centrale del quaderno e della card */
    .scene-wrapper {
      position: relative;
      width: 100%;
      max-width: 580px;
      height: 420px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    .notebook-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: none;
      box-shadow: none;
    }

    .splash-card {
      position: absolute;
      width: 320px;
      height: 220px;
      background: #111111 url('./4e432360601c9df1cab3274448a0fa56.gif') no-repeat center center;
      background-size: cover;
      border: 3px solid #111111;
      border-radius: 28px;
      padding: 30px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 25px;
      overflow: hidden;
      z-index: 2;
    }

    .splash-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1;
    }

    .splash-card > * {
      position: relative;
      z-index: 2;
    }

    .splash-title {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 0 10px rgba(255,255,255,0.9), 0 0 20px rgba(255,255,255,0.6);
    }

    .enter-btn {
      display: block;
      width: 100%;
      background: #ffffff;
      color: #111111;
      border: none;
      border-radius: 16px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .enter-btn:hover {
      background: #f0f0f3;
    }

    /* Post-it interattivo (colore F3EEDA) */
    .update-postit {
      position: absolute;
      top: 35px;
      right: 35px;
      z-index: 4;
      cursor: pointer;
    }

    .postit-tab {
      background: #F3EEDA;
      color: #222222;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 4px;
      box-shadow: 2px 3px 6px rgba(0,0,0,0.2);
      transform: rotate(6deg);
      border: 1px dashed #d5ccb6;
      transition: transform 0.15s ease, background 0.15s ease;
      letter-spacing: 0.5px;
    }

    .postit-tab:hover {
      background: #eae3cc;
      transform: rotate(6deg) scale(1.05);
    }

    .postit-popup {
      position: absolute;
      top: 35px;
      right: 0;
      width: 200px;
      background: #F3EEDA;
      border: 2px solid #d5ccb6;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 3px 5px 12px rgba(0,0,0,0.25);
      transform: rotate(2deg);
      display: none;
      z-index: 5;
      text-align: left;
    }

    .postit-popup.active {
      display: block;
    }

    .postit-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      border-bottom: 1px solid #d5ccb6;
      padding-bottom: 4px;
    }

    .postit-title {
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      color: #333333;
      letter-spacing: 1px;
    }

    .postit-close {
      background: none;
      border: none;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      color: #555555;
    }

    .postit-close:hover {
      color: #000000;
    }

    .postit-content {
      font-size: 0.75rem;
      font-weight: 700;
      color: #222222;
      line-height: 1.3;
    }

    /* Ottimizzazione per smartphone */
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .scene-wrapper {
        height: 360px;
        max-width: 100%;
      }

      .splash-card {
        width: 260px;
        height: 180px;
        padding: 20px 15px;
        gap: 18px;
        border-radius: 22px;
        border-width: 2px;
      }

      .splash-title {
        font-size: 1.8rem;
      }

      .enter-btn {
        padding: 10px;
        font-size: 0.9rem;
        border-radius: 12px;
      }

      .update-postit {
        top: 20px;
        right: 20px;
      }

      .postit-tab {
        font-size: 0.65rem;
        padding: 4px 8px;
      }

      .postit-popup {
        width: 170px;
        top: 25px;
        right: 0;
        padding: 10px;
      }

      /* Timbri leggermente più grandi ma adattati per smartphone */
      .stamp-1  { width: 52px; top: 5%; left: 4%; }
      .stamp-2  { width: 58px; top: 3%; left: 40%; }
      .stamp-3  { width: 50px; top: 6%; right: 5%; }
      .stamp-4  { width: 60px; top: 42%; left: 2%; }
      .stamp-5  { width: 52px; top: 38%; right: 2%; }
      .stamp-6  { width: 54px; bottom: 5%; left: 5%; }
      .stamp-7  { width: 48px; bottom: 4%; left: 45%; }
      .stamp-8  { width: 56px; bottom: 5%; right: 5%; }
      .stamp-9  { width: 50px; top: 20% ; left: 6%; }
      .stamp-10 { width: 54px; top: 22% ; right: 6%; }
      .stamp-11 { width: 48px; bottom: 22%; left: 6%; }
      .stamp-12 { width: 52px; bottom: 20%; right: 6%; }
      .stamp-13 { width: 58px; top: 2%  ; left: 20%; }
      .stamp-14 { width: 46px; bottom: 2%; left: 25%; }
      .stamp-15 { width: 52px; top: 70% ; right: 4%; }
    }
  </style>
</head>
<body>

  <img src="./stamp-1.png" alt="Stamp 1" class="stamp-sticker stamp-1">
  <img src="./stamp-2.png" alt="Stamp 2" class="stamp-sticker stamp-2">
  <img src="./stamp-3.png" alt="Stamp 3" class="stamp-sticker stamp-3">
  <img src="./stamp-4.png" alt="Stamp 4" class="stamp-sticker stamp-4">
  <img src="./stamp-5.png" alt="Stamp 5" class="stamp-sticker stamp-5">
  <img src="./stamp-6.png" alt="Stamp 6" class="stamp-sticker stamp-6">
  <img src="./stamp-7.png" alt="Stamp 7" class="stamp-sticker stamp-7">
  <img src="./stamp-8.png" alt="Stamp 8" class="stamp-sticker stamp-8">
  <img src="./stamp-9.png" alt="Stamp 9" class="stamp-sticker stamp-9">
  <img src="./stamp-10.png" alt="Stamp 10" class="stamp-sticker stamp-10">
  <img src="./stamp-11.png" alt="Stamp 11" class="stamp-sticker stamp-11">
  <img src="./stamp-12.png" alt="Stamp 12" class="stamp-sticker stamp-12">
  <img src="./stamp-13.png" alt="Stamp 13" class="stamp-sticker stamp-13">
  <img src="./stamp-14.png" alt="Stamp 14" class="stamp-sticker stamp-14">
  <img src="./stamp-15.png" alt="Stamp 15" class="stamp-sticker stamp-15">

  <div class="scene-wrapper">
    <img src="./notebook-spread.png" alt="Notebook Background" class="notebook-bg">

    <div class="update-postit">
      <div class="postit-tab" id="postitTab">𖡎 What's New?</div>
      <div class="postit-popup" id="postitPopup">
        <div class="postit-header">
          <span class="postit-title">Latest Updates</span>
          <button class="postit-close" id="postitClose">✕</button>
        </div>
        <div class="postit-content">
          Ⰶ Added new stamps inspired by 1776! Check them out in the stamps gallery.
        </div>
      </div>
    </div>

    <div class="splash-card">
      <h1 class="splash-title">COSMIC-S</h1>
      <a href="https://seea-star.github.io/Cosmic-S-Home/" class="enter-btn">ENTER →</a>
    </div>
  </div>

  <script>
    const tab = document.getElementById('postitTab');
    const popup = document.getElementById('postitPopup');
    const closeBtn = document.getElementById('postitClose');

    tab.addEventListener('click', (e) => {
      e.stopPropagation();
      popup.classList.toggle('active');
    });

    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      popup.classList.remove('active');
    });

    document.addEventListener('click', (e) => {
      if (!popup.contains(e.target) && e.target !== tab) {
        popup.classList.remove('active');
      }
    });
  </script>

</body>
</html>
