<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COSMIC-S</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: auto;
      position: relative;
    }

    /* Contenitore a misura fissa per bloccare i timbri nella fascia di sicurezza intermedia */
    .scene-wrapper {
      position: relative;
      width: 820px;
      height: 520px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1;
      flex-shrink: 0;
    }

    /* Il foglio del quaderno al centro */
    .notebook-bg {
      position: absolute;
      width: 580px;
      height: 420px;
      object-fit: contain;
      z-index: 1;
    }

    .splash-card {
      position: absolute;
      width: 320px;
      height: 220px;
      background: #111111 url('./4e432360601c9df1cab3274448a0fa56.gif') no-repeat center center;
      background-size: cover;
      border: 3px solid #111111;
      border-radius: 28px;
      padding: 30px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 25px;
      overflow: hidden;
      z-index: 6;
    }

    .splash-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1;
    }

    .splash-card > * {
      position: relative;
      z-index: 2;
    }

    /* Pulsante per aprire gli aggiornamenti */
    .card-toggle-btn {
      position: absolute;
      top: 12px;
      right: 15px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      z-index: 10;
      transition: background 0.15s ease;
    }

    .card-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    /* Vista principale */
    .card-main-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      width: 100%;
    }

    .card-main-view.hidden {
      display: none !important;
    }

    .splash-title {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 0 10px rgba(255,255,255,0.9), 0 0 20px rgba(255,255,255,0.6);
    }

    .enter-btn {
      display: block;
      width: 100%;
      background: #ffffff;
      color: #111111;
      border: none;
      border-radius: 16px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .enter-btn:hover {
      background: #f0f0f3;
    }

    /* Vista degli aggiornamenti */
    .card-updates-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 10px 5px;
      text-align: left;
    }

    .card-updates-view.active {
      display: flex;
    }

    .updates-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
    }

    .updates-text {
      font-size: 0.75rem;
      font-weight: 700;
      color: #f0f0f0;
      line-height: 1.4;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      max-height: 120px;
      overflow-y: auto;
      padding-right: 4px;
    }

    /* Timbri */
    .stamp-sticker {
      position: absolute;
      height: auto;
      z-index: 5;
      pointer-events: none;
      filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
    }

    .stamp-1  { width: 42px; top: 10%; left: 16%; transform: rotate(-14deg); }
    .stamp-2  { width: 58px; top: 8%; left: 32%; transform: rotate(10deg); }
    .stamp-3  { width: 48px; top: 10%; right: 18%; transform: rotate(16deg); }
    .stamp-4  { width: 66px; top: 44%; left: 10%; transform: rotate(20deg); }
    .stamp-5  { width: 52px; top: 42%; right: 10%; transform: rotate(-18deg); }
    .stamp-6  { width: 55px; bottom: 12%; left: 15%; transform: rotate(-10deg); }
    /* Timbro 7 leggermente più vicino al centro e più grande */
    .stamp-7  { width: 48px; bottom: 18%; left: 40%; transform: rotate(14deg); }
    .stamp-8  { width: 62px; bottom: 12%; right: 15%; transform: rotate(-12deg); }
    .stamp-9  { width: 48px; top: 28%; left: 13%; transform: rotate(6deg); }
    .stamp-10 { width: 56px; top: 28%; right: 13%; transform: rotate(-8deg); }
    .stamp-11 { width: 42px; bottom: 28%; left: 15%; transform: rotate(-16deg); }
    .stamp-12 { width: 52px; bottom: 26%; right: 15%; transform: rotate(18deg); }
    /* Timbro 13 leggermente più vicino al centro e più grande */
    .stamp-13 { width: 72px; top: 14%; left: 44%; transform: rotate(-5deg); }
    .stamp-14 { width: 36px; bottom: 8%; left: 50%; transform: rotate(9deg); }
    /* Timbro 15 leggermente più vicino al centro e più grande */
    .stamp-15 { width: 54px; bottom: 22%; right: 41%; transform: rotate(-13deg); }

    /* Ottimizzazione per smartphone */
    @media (max-width: 600px) {
      .scene-wrapper {
        width: 100%;
        height: 420px;
      }

      .notebook-bg {
        width: 100%;
        max-width: 360px;
        height: 340px;
      }

      .splash-card {
        width: 240px;
        height: 170px;
        padding: 18px 12px;
        gap: 15px;
        border-radius: 20px;
      }

      .splash-title {
        font-size: 1.6rem;
      }

      .enter-btn {
        padding: 9px;
        font-size: 0.85rem;
      }

      .stamp-1  { width: 30px; top: 15%; left: 12%; }
      .stamp-2  { width: 40px; top: 12%; left: 28%; }
      .stamp-3  { width: 32px; top: 14%; right: 12%; }
      .stamp-4  { width: 44px; top: 43%; left: 6%; }
      .stamp-5  { width: 36px; top: 40%; right: 6%; }
      .stamp-6  { width: 38px; bottom: 15%; left: 10%; }
      .stamp-7  { width: 34px; bottom: 20%; left: 35%; }
      .stamp-8  { width: 42px; bottom: 15%; right: 10%; }
      .stamp-9  { width: 32px; top: 27%; left: 9%; }
      .stamp-10 { width: 38px; top: 27%; right: 9%; }
      .stamp-11 { width: 30px; bottom: 27%; left: 10%; }
      .stamp-12 { width: 36px; bottom: 25%; right: 10%; }
      .stamp-13 { width: 48px; top: 16%; left: 40%; }
      .stamp-14 { width: 26px; bottom: 10%; left: 45%; }
      .stamp-15 { width: 38px; bottom: 23%; right: 36%; }
    }
  </style>
</head>
<body>

  <img src="./stamp-1.png" alt="Stamp 1" class="stamp-sticker stamp-1">
  <img src="./stamp-2.png" alt="Stamp 2" class="stamp-sticker stamp-2">
  <img src="./stamp-3.png" alt="Stamp 3" class="stamp-sticker stamp-3">
  <img src="./stamp-4.png" alt="Stamp 4" class="stamp-sticker stamp-4">
  <img src="./stamp-5.png" alt="Stamp 5" class="stamp-sticker stamp-5">
  <img src="./stamp-6.png" alt="Stamp 6" class="stamp-sticker stamp-6">
  <img src="./stamp-7.png" alt="Stamp 7" class="stamp-sticker stamp-7">
  <img src="./stamp-8.png" alt="Stamp 8" class="stamp-sticker stamp-8">
  <img src="./stamp-9.png" alt="Stamp 9" class="stamp-sticker stamp-9">
  <img src="./stamp-10.png" alt="Stamp 10" class="stamp-sticker stamp-10">
  <img src="./stamp-11.png" alt="Stamp 11" class="stamp-sticker stamp-11">
  <img src="./stamp-12.png" alt="Stamp 12" class="stamp-sticker stamp-12">
  <img src="./stamp-13.png" alt="Stamp 13" class="stamp-sticker stamp-13">
  <img src="./stamp-14.png" alt="Stamp 14" class="stamp-sticker stamp-14">
  <img src="./stamp-15.png" alt="Stamp 15" class="stamp-sticker stamp-15">

  <div class="scene-wrapper">
    <img src="./notebook-spread.png" alt="Notebook Background" class="notebook-bg">

    <div class="splash-card">
      <button class="card-toggle-btn" id="toggleBtn">What's New?</button>

      <div class="card-main-view" id="mainView">
        <h1 class="splash-title">COSMIC-S</h1>
        <a href="https://seea-star.github.io/Cosmic-S-Home/" class="enter-btn">ENTER →</a>
      </div>

      <div class="card-updates-view" id="updatesView">
        <div class="updates-title">Latest Updates</div>
        <div class="updates-text">
          ✦ Added new stamps inspired by 1776! Check them out in the stamps gallery.
        </div>
      </div>
    </div>
  </div>

  <script>
    const toggleBtn = document.getElementById('toggleBtn');
    const mainView = document.getElementById('mainView');
    const updatesView = document.getElementById('updatesView');

    toggleBtn.addEventListener('click', () => {
      const isUpdatesOpen = updatesView.classList.toggle('active');
      mainView.classList.toggle('hidden', isUpdatesOpen);
      toggleBtn.textContent = isUpdatesOpen ? '✕' : "What's New?";
    });
  </script>

</body>
</html>
