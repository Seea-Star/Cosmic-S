<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSMIC-S</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Box principale con la GIF come sfondo */
    .splash-card {
      max-width: 420px;
      width: 100%;
      background: #111111 url('./4e432360601c9df1cab3274448a0fa56.gif') no-repeat center center;
      background-size: cover;
      border: 3px solid #111111;
      border-radius: 32px;
      padding: 50px 30px;
      box-shadow: 6px 6px 0px #111111;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 40px;
      position: relative;
      overflow: hidden;
    }

    /* Sfumatura scura trasparente sopra la GIF per leggibilità */
    .splash-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1;
    }

    .splash-card > * {
      position: relative;
      z-index: 2;
    }

    /* Scritta bianca con la sfumatura luminosa */
    .splash-title {
      font-size: 3.2rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 0 10px rgba(255,255,255,0.9), 0 0 20px rgba(255,255,255,0.6);
    }

    /* Pulsante bianco senza bordo e con l'aura luminosa */
    .enter-btn {
      display: block;
      width: 100%;
      background: #ffffff;
      color: #111111;
      border: none;
      border-radius: 20px;
      padding: 15px;
      font-size: 1.1rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.9);
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .enter-btn:hover {
      background: #f0f0f3;
      box-shadow: 0 0 30px rgba(255, 255, 255, 1);
    }

    .enter-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
    }
  </style>
</head>
<body>

  <div class="splash-card">
    <h1 class="splash-title">COSMIC-S</h1>
    
    <a href="https://seea-star.github.io/Cosmic-S-Home/" class="enter-btn">ENTER →</a>
  </div>

</body>
</html>
