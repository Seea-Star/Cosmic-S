<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COSMIC-S</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: auto;
      position: relative;
    }

    .scene-wrapper {
      position: relative;
      width: 820px;
      height: 520px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1;
      flex-shrink: 0;
    }

    .notebook-bg {
      position: absolute;
      width: 580px;
      height: 420px;
      object-fit: contain;
      z-index: 1;
    }

    .splash-card {
      position: absolute;
      width: 320px;
      height: 220px;
      background: #111111 url('./4e432360601c9df1cab3274448a0fa56.gif') no-repeat center center;
      background-size: cover;
      border: 3px solid #111111;
      border-radius: 28px;
      padding: 30px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 25px;
      overflow: hidden;
      z-index: 6;
    }

    .splash-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1;
    }

    .splash-card > * {
      position: relative;
      z-index: 2;
    }

    .card-main-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      width: 100%;
    }

    /* Nome del sito leggermente più grande e con un glow più intenso */
    .splash-title {
      font-size: 2.7rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 0 14px rgba(255,255,255,1), 0 0 28px rgba(255,255,255,0.8), 0 0 40px rgba(255,255,255,0.4);
    }

    .enter-btn {
      display: block;
      width: 100%;
      background: #ffffff;
      color: #111111;
      border: none;
      border-radius: 16px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .enter-btn:hover {
      background: #f0f0f3;
    }

    /* Animazione di flottamento (floating) */
    @keyframes floatStamps {
      0% {
        transform: translateY(0px) rotate(var(--base-rot));
      }
      50% {
        transform: translateY(-6px) rotate(calc(var(--base-rot) + 2deg));
      }
      100% {
        transform: translateY(0px) rotate(var(--base-rot));
      }
    }

    /* Timbri (ingranditi leggermente, con posizioni e scambi di posto, e animati) */
    .stamp-sticker {
      position: absolute;
      height: auto;
      z-index: 5;
      pointer-events: none;
      filter: drop-shadow(3px 3px 6px rgba(0,0,0,0.35));
      animation: floatStamps 4s ease-in-out infinite;
    }

    /* Tempi di animazione sfasati per non farli muovere tutti insieme */
    .stamp-1  { width: 64px;  top: 6%;   left: 24%;   --base-rot: 8deg;     animation-delay: 0s; }
    .stamp-2  { width: 84px;  top: 38%;  left: 3%;    --base-rot: -12deg;   animation-delay: 0.5s; }
    .stamp-3  { width: 72px;  bottom: 8%; left: 35%;  --base-rot: 14deg;    animation-delay: 1s; }
    .stamp-4  { width: 92px;  top: 12%;  right: 12%;  --base-rot: -16deg;   animation-delay: 1.5s; }
    .stamp-5  { width: 76px;  bottom: 8%; right: 22%; --base-rot: 10deg;    animation-delay: 2s; }
    .stamp-6  { width: 80px;  top: 40%;  right: 4%;   --base-rot: -8deg;    animation-delay: 2.5s; }
    .stamp-7  { width: 70px;  top: 14%;  left: 6%;    --base-rot: 18deg;    animation-delay: 0.3s; }
    .stamp-8  { width: 88px;  bottom: 12%; left: 8%;  --base-rot: -14deg;   animation-delay: 0.8s; }
    .stamp-21 { width: 70px;  top: 26%;  left: 10%;   --base-rot: -6deg;    animation-delay: 1.2s; }
    .stamp-22 { width: 80px;  top: 28%;  right: 11%;  --base-rot: 12deg;    animation-delay: 1.7s; }
    .stamp-23 { width: 64px;  bottom: 24%; left: 14%; --base-rot: 16deg;    animation-delay: 2.2s; }
    .stamp-24 { width: 76px;  bottom: 22%; right: 13%; --base-rot: -18deg;  animation-delay: 0.4s; }
    .stamp-25 { width: 100px; top: 4%;    left: 42%;   --base-rot: 5deg;     animation-delay: 0.9s; }
    .stamp-26 { width: 56px;  bottom: 4%; left: 48%;  --base-rot: -9deg;    animation-delay: 1.4s; }
    .stamp-27 { width: 78px;  bottom: 30%; right: 38%; --base-rot: 13deg;   animation-delay: 1.9s; }

    /* Ottimizzazione per smartphone */
    @media (max-width: 600px) {
      .scene-wrapper {
        width: 100%;
        height: 420px;
      }

      .notebook-bg {
        width: 100%;
        max-width: 360px;
        height: 340px;
      }

      .splash-card {
        width: 240px;
        height: 170px;
        padding: 18px 12px;
        gap: 15px;
        border-radius: 20px;
      }

      .splash-title {
        font-size: 2.1rem;
      }

      .enter-btn {
        padding: 9px;
        font-size: 0.85rem;
      }

      .stamp-1  { width: 48px;  top: 8%;   left: 18%; }
      .stamp-2  { width: 60px;  top: 36%;  left: 4%; }
      .stamp-3  { width: 52px;  bottom: 10%; left: 30%; }
      .stamp-4  { width: 64px;  top: 10%;  right: 8%; }
      .stamp-5  { width: 54px;  bottom: 10%; right: 16%; }
      .stamp-6  { width: 58px;  top: 38%;  right: 4%; }
      .stamp-7  { width: 50px;  top: 12%;  left: 6%; }
      .stamp-8  { width: 62px;  bottom: 12%; left: 6%; }
      .stamp-21 { width: 50px;  top: 25%;  left: 8%; }
      .stamp-22 { width: 58px;  top: 25%;  right: 8%; }
      .stamp-23 { width: 46px;  bottom: 22%; left: 10%; }
      .stamp-24 { width: 54px;  bottom: 20%; right: 10%; }
      .stamp-25 { width: 70px;  top: 4%;    left: 38%; }
      .stamp-26 { width: 40px;  bottom: 6%; left: 44%; }
      .stamp-27 { width: 56px;  bottom: 26%; right: 34%; }
    }
  </style>
</head>
<body>

  <img src="./stamp-1.png" alt="Stamp 1" class="stamp-sticker stamp-1">
  <img src="./stamp-2.png" alt="Stamp 2" class="stamp-sticker stamp-2">
  <img src="./stamp-3.png" alt="Stamp 3" class="stamp-sticker stamp-3">
  <img src="./stamp-4.png" alt="Stamp 4" class="stamp-sticker stamp-4">
  <img src="./stamp-5.png" alt="Stamp 5" class="stamp-sticker stamp-5">
  <img src="./stamp-6.png" alt="Stamp 6" class="stamp-sticker stamp-6">
  <img src="./stamp-7.png" alt="Stamp 7" class="stamp-sticker stamp-7">
  <img src="./stamp-8.png" alt="Stamp 8" class="stamp-sticker stamp-8">
  <img src="./stamp-21.png" alt="Stamp 21" class="stamp-sticker stamp-21">
  <img src="./stamp-22.png" alt="Stamp 22" class="stamp-sticker stamp-22">
  <img src="./stamp-23.png" alt="Stamp 23" class="stamp-sticker stamp-23">
  <img src="./stamp-24.png" alt="Stamp 24" class="stamp-sticker stamp-24">
  <img src="./stamp-25.png" alt="Stamp 25" class="stamp-sticker stamp-25">
  <img src="./stamp-26.png" alt="Stamp 26" class="stamp-sticker stamp-26">
  <img src="./stamp-27.png" alt="Stamp 27" class="stamp-sticker stamp-27">

  <div class="scene-wrapper">
    <img src="./notebook-spread.png" alt="Notebook Background" class="notebook-bg">

    <div class="splash-card">
      <div class="card-main-view" id="mainView">
        <h1 class="splash-title">COSMIC-S</h1>
        <a href="https://seea-star.github.io/Cosmic-S-Home/" class="enter-btn">ENTER -></a>
      </div>
    </div>
  </div>

</body>
</html>
