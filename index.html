<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COSMIC-S</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: auto;
      position: relative;
    }

    .scene-wrapper {
      position: relative;
      width: 820px;
      height: 520px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1;
      flex-shrink: 0;
    }

    .notebook-bg {
      position: absolute;
      width: 580px;
      height: 420px;
      object-fit: contain;
      z-index: 1;
    }

    .splash-card {
      position: absolute;
      width: 320px;
      height: 220px;
      background: #111111 url('./4e432360601c9df1cab3274448a0fa56.gif') no-repeat center center;
      background-size: cover;
      border: 3px solid #111111;
      border-radius: 28px;
      padding: 30px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 25px;
      overflow: hidden;
      z-index: 6;
    }

    .splash-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1;
    }

    .splash-card > * {
      position: relative;
      z-index: 2;
    }

    .card-main-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      width: 100%;
    }

    /* Nome del sito leggermente più grande e con un glow più intenso */
    .splash-title {
      font-size: 2.7rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 0 14px rgba(255,255,255,1), 0 0 28px rgba(255,255,255,0.8), 0 0 40px rgba(255,255,255,0.4);
    }

    .enter-btn {
      display: block;
      width: 100%;
      background: #ffffff;
      color: #111111;
      border: none;
      border-radius: 16px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .enter-btn:hover {
      background: #f0f0f3;
    }

    /* Timbri */
    .stamp-sticker {
      position: absolute;
      height: auto;
      z-index: 5;
      pointer-events: none;
      filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
    }

    .stamp-1  { width: 52px; top: 10%; left: 16%; transform: rotate(-14deg); }
    .stamp-2  { width: 70px; top: 8%; left: 32%; transform: rotate(10deg); }
    .stamp-3  { width: 58px; top: 10%; right: 18%; transform: rotate(16deg); }
    .stamp-4  { width: 78px; top: 44%; left: 10%; transform: rotate(20deg); }
    .stamp-5  { width: 62px; top: 42%; right: 10%; transform: rotate(-18deg); }
    .stamp-6  { width: 66px; bottom: 12%; left: 15%; transform: rotate(-10deg); }
    .stamp-7  { width: 58px; bottom: 18%; left: 40%; transform: rotate(14deg); }
    .stamp-8  { width: 74px; bottom: 12%; right: 15%; transform: rotate(-12deg); }
    .stamp-21 { width: 58px; top: 28%; left: 13%; transform: rotate(6deg); }
    .stamp-22 { width: 66px; top: 28%; right: 13%; transform: rotate(-8deg); }
    .stamp-23 { width: 52px; bottom: 28%; left: 15%; transform: rotate(-16deg); }
    .stamp-24 { width: 62px; bottom: 26%; right: 15%; transform: rotate(18deg); }
    .stamp-25 { width: 84px; top: 14%; left: 44%; transform: rotate(-5deg); }
    .stamp-26 { width: 46px; bottom: 8%; left: 50%; transform: rotate(9deg); }
    .stamp-27 { width: 64px; bottom: 22%; right: 41%; transform: rotate(-13deg); }

    /* Ottimizzazione per smartphone */
    @media (max-width: 600px) {
      .scene-wrapper {
        width: 100%;
        height: 420px;
      }

      .notebook-bg {
        width: 100%;
        max-width: 360px;
        height: 340px;
      }

      .splash-card {
        width: 240px;
        height: 170px;
        padding: 18px 12px;
        gap: 15px;
        border-radius: 20px;
      }

      .splash-title {
        font-size: 2.1rem;
      }

      .enter-btn {
        padding: 9px;
        font-size: 0.85rem;
      }

      .stamp-1  { width: 38px; top: 15%; left: 12%; }
      .stamp-2  { width: 50px; top: 12%; left: 28%; }
      .stamp-3  { width: 40px; top: 14%; right: 12%; }
      .stamp-4  { width: 54px; top: 43%; left: 6%; }
      .stamp-5  { width: 44px; top: 40%; right: 6%; }
      .stamp-6  { width: 48px; bottom: 15%; left: 10%; }
      .stamp-7  { width: 42px; bottom: 20%; left: 35%; }
      .stamp-8  { width: 52px; bottom: 15%; right: 10%; }
      .stamp-21 { width: 40px; top: 27%; left: 9%; }
      .stamp-22 { width: 48px; top: 27%; right: 9%; }
      .stamp-23 { width: 38px; bottom: 27%; left: 10%; }
      .stamp-24 { width: 44px; bottom: 25%; right: 10%; }
      .stamp-25 { width: 58px; top: 16%; left: 40%; }
      .stamp-26 { width: 34px; bottom: 10%; left: 45%; }
      .stamp-27 { width: 46px; bottom: 23%; right: 36%; }
    }
  </style>
</head>
<body>

  <img src="./stamp-1.png" alt="Stamp 1" class="stamp-sticker stamp-1">
  <img src="./stamp-2.png" alt="Stamp 2" class="stamp-sticker stamp-2">
  <img src="./stamp-3.png" alt="Stamp 3" class="stamp-sticker stamp-3">
  <img src="./stamp-4.png" alt="Stamp 4" class="stamp-sticker stamp-4">
  <img src="./stamp-5.png" alt="Stamp 5" class="stamp-sticker stamp-5">
  <img src="./stamp-6.png" alt="Stamp 6" class="stamp-sticker stamp-6">
  <img src="./stamp-7.png" alt="Stamp 7" class="stamp-sticker stamp-7">
  <img src="./stamp-8.png" alt="Stamp 8" class="stamp-sticker stamp-8">
  <img src="./stamp-21.png" alt="Stamp 21" class="stamp-sticker stamp-21">
  <img src="./stamp-22.png" alt="Stamp 22" class="stamp-sticker stamp-22">
  <img src="./stamp-23.png" alt="Stamp 23" class="stamp-sticker stamp-23">
  <img src="./stamp-24.png" alt="Stamp 24" class="stamp-sticker stamp-24">
  <img src="./stamp-25.png" alt="Stamp 25" class="stamp-sticker stamp-25">
  <img src="./stamp-26.png" alt="Stamp 26" class="stamp-sticker stamp-26">
  <img src="./stamp-27.png" alt="Stamp 27" class="stamp-sticker stamp-27">

  <div class="scene-wrapper">
    <img src="./notebook-spread.png" alt="Notebook Background" class="notebook-bg">

    <div class="splash-card">
      <div class="card-main-view" id="mainView">
        <h1 class="splash-title">COSMIC-S</h1>
        <a href="https://seea-star.github.io/Cosmic-S-Home/" class="enter-btn">ENTER -></a>
      </div>
    </div>
  </div>

</body>
</html>
