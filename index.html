<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COSMIC-S</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      overflow-x: hidden;
    }

    /* Struttura principale con dimensioni fisse per evitare differenze tra browser */
    .scene-wrapper {
      position: relative;
      width: 480px;
      height: 340px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Immagine del quaderno a dimensioni fisse, senza ombra */
    .notebook-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: none;
      box-shadow: none;
    }

    /* Box nero centrale con dimensioni fisse e la sua ombra originale */
    .splash-card {
      position: absolute;
      width: 320px;
      height: 220px;
      background: #111111 url('./4e432360601c9df1cab3274448a0fa56.gif') no-repeat center center;
      background-size: cover;
      border: 3px solid #111111;
      border-radius: 28px;
      padding: 30px 20px;
      box-shadow: 6px 6px 0px #111111;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 25px;
      overflow: hidden;
      z-index: 2;
    }

    .splash-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1;
    }

    .splash-card > * {
      position: relative;
      z-index: 2;
    }

    .splash-title {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 0 10px rgba(255,255,255,0.9), 0 0 20px rgba(255,255,255,0.6);
    }

    .enter-btn {
      display: block;
      width: 100%;
      background: #ffffff;
      color: #111111;
      border: none;
      border-radius: 16px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .enter-btn:hover {
      background: #f0f0f3;
    }
  </style>
</head>
<body>

  <div class="scene-wrapper">
    <img src="./notebook-spread.png" alt="Notebook Background" class="notebook-bg">

    <div class="splash-card">
      <h1 class="splash-title">COSMIC-S</h1>
      <a href="https://seea-star.github.io/Cosmic-S-Home/" class="enter-btn">ENTER →</a>
    </div>
  </div>

</body>
</html>
