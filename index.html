<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome - COSMIC-S</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .splash-card {
      max-width: 420px;
      width: 100%;
      background: #ffffff;
      border: 3px solid #111111;
      border-radius: 32px;
      padding: 30px;
      box-shadow: 6px 6px 0px #111111;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .splash-title {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #111;
    }

    .splash-box {
      background: #111111;
      color: #ffffff;
      border-radius: 16px;
      padding: 15px;
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1.5;
    }

    .enter-btn {
      display: block;
      width: 100%;
      background: #ffffff;
      color: #111111;
      border: 3px solid #111111;
      border-radius: 20px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 4px 4px 0px #111111;
      transition: all 0.1s ease;
      cursor: pointer;
    }

    .enter-btn:hover {
      background: #111111;
      color: #ffffff;
    }

    .enter-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #111111;
    }
  </style>
</head>
<body>

  <div class="splash-card">
    <h1 class="splash-title">COSMIC-S</h1>
    
    <div class="splash-box">
      Welcome to my personal space on the web.<br>
      Please enter at your own risk. ✨
    </div>

    <a href="./home.html" class="enter-btn">ENTRA →</a>
  </div>

</body>
</html>
</html>
