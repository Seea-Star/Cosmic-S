<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COSMIC-S</title>
  <link rel="icon" type="image/png" href="https://cosmic-seea.neocities.org/stamp-5.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'Starshines';
      src: url('https://seea-star.github.io/Fonts/Starshines.otf') format('opentype');
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    .scene-wrapper {
      position: relative;
      width: 820px;
      height: 580px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1;
      flex-shrink: 0;
    }

    /* CARD NERA CENTRALE CON GIF */
    .splash-card {
      position: relative;
      width: 320px;
      height: 220px;
      background: #111111 url('./4e432360601c9df1cab3274448a0fa56.gif') no-repeat center center;
      background-size: cover;
      border: 3px solid #111111;
      border-radius: 28px;
      padding: 30px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 25px;
      overflow: hidden;
      z-index: 6;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
    }

    .splash-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1;
    }

    .splash-card > * {
      position: relative;
      z-index: 2;
    }

    .card-main-view {
      font-family: 'Starshines', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      width: 100%;
    }

    .splash-title {
      font-size: 2.7rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 0 14px rgba(255,255,255,1), 0 0 28px rgba(255,255,255,0.8), 0 0 40px rgba(255,255,255,0.4);
    }

    .enter-btn {
      display: block;
      width: 100%;
      background: #ffffff;
      color: #111111;
      border: none;
      border-radius: 16px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .enter-btn:hover {
      background: #ffffff;
      box-shadow: 0 0 25px rgba(255, 255, 255, 1), 0 0 35px rgba(225, 218, 185, 0.8);
      transform: scale(1.03);
    }

    /* DIARIO (IN ALTO A SINISTRA) CON GLOW */
    .interactive-diary {
      position: absolute;
      top: 18px;
      left: 170px;
      width: 155px;
      height: auto;
      z-index: 10;
      cursor: pointer;
      transition: transform 0.3s ease, filter 0.3s ease;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.4));
    }

    .interactive-diary:hover {
      transform: scale(1.08) rotate(-4deg);
      filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.9)) drop-shadow(0 0 25px rgba(225, 218, 185, 0.8));
    }

    /* ANIMAZIONE DI FLUTTUAZIONE DELL'AVATAR (IN BASSO A DESTRA) */
    @keyframes floatAvatar {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }

    .interactive-avatar {
      position: absolute;
      bottom: 10px;
      right: 150px;
      width: 220px;
      height: auto;
      z-index: 10;
      cursor: pointer;
      animation: floatAvatar 4.5s ease-in-out infinite;
      transition: filter 0.3s ease, transform 0.3s ease;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
    }

    .interactive-avatar:hover {
      filter: drop-shadow(0 0 22px rgba(255, 255, 255, 1)) drop-shadow(0 0 35px rgba(225, 218, 185, 0.9));
    }

    /* TIMBRI E STICKERS FLUTTUANTI */
    @keyframes floatStamps {
      0% { transform: translateY(0px) rotate(var(--base-rot)); }
      50% { transform: translateY(-6px) rotate(calc(var(--base-rot) + 2deg)); }
      100% { transform: translateY(0px) rotate(var(--base-rot)); }
    }

    .stamp-sticker {
      position: absolute;
      height: auto;
      z-index: 5;
      pointer-events: none;
      filter: drop-shadow(3px 3px 6px rgba(0,0,0,0.25));
      animation: floatStamps 4s ease-in-out infinite;
    }

    .stamp-5  { width: 76px;  bottom: 10%; left: 16%; --base-rot: 10deg;   animation-delay: 0.5s; }
    .stamp-8  { width: 88px;  top: 10%;    right: 18%; --base-rot: -14deg;  animation-delay: 1.2s; }
    .stamp-1  { width: 64px;  top: 6%;     left: 8%;   --base-rot: 8deg;    animation-delay: 0s; }
    .stamp-4  { width: 80px;  bottom: 8%;  right: 10%; --base-rot: -16deg;  animation-delay: 1.8s; }

    /* SEGNAPOSTO PER LE FUTURE STELLINE TRASPARENTI */
    .star-placeholder {
      position: absolute;
      width: 24px;
      height: 24px;
      border: 1px dashed rgba(0, 0, 0, 0.2);
      border-radius: 4px;
      z-index: 4;
      pointer-events: none;
    }
    .star-1 { top: 18%; left: 36%; }
    .star-2 { bottom: 25%; right: 38%; }
    .star-3 { top: 45%; left: 10%; }
    .star-4 { bottom: 42%; right: 12%; }

    /* ADATTAMENTO MOBILE */
    @media (max-width: 600px) {
      .scene-wrapper {
        width: 100%;
        height: 500px;
      }

      .splash-card {
        width: 250px;
        height: 175px;
        padding: 18px 12px;
        gap: 15px;
        border-radius: 20px;
      }

      .splash-title { font-size: 2.1rem; }
      .enter-btn { padding: 9px; font-size: 0.85rem; }

      .interactive-diary {
        width: 110px;
        top: 25px;
        left: 30px;
      }

      .interactive-avatar {
        width: 160px;
        bottom: 15px;
        right: 20px;
      }

      .stamp-5 { width: 54px; bottom: 8%; left: 8%; }
      .stamp-8 { width: 60px; top: 6%; right: 8%; }
      .stamp-1 { width: 48px; top: 4%; left: 4%; }
      .stamp-4 { width: 56px; bottom: 6%; right: 6%; }
    }
  </style>
</head>
<body>

  <!-- TIMBRI TRATTENUTI -->
  <img src="./stamp-1.png" alt="Stamp 1" class="stamp-sticker stamp-1">
  <img src="./stamp-5.png" alt="Stamp 5" class="stamp-sticker stamp-5">
  <img src="./stamp-8.png" alt="Stamp 8" class="stamp-sticker stamp-8">
  <img src="./stamp-4.png" alt="Stamp 4" class="stamp-sticker stamp-4">

  <!-- SEGNAPOSTO PER STELLINE TRASPARENTI -->
  <div class="star-placeholder star-1"></div>
  <div class="star-placeholder star-2"></div>
  <div class="star-placeholder star-3"></div>
  <div class="star-placeholder star-4"></div>

  <div class="scene-wrapper">

    <!-- DIARIO IN ALTO A SINISTRA DELLA CARD -->
    <img src="./Diary.png" alt="Diario" class="interactive-diary">

    <!-- CARD NERA CENTRALE CON GIF -->
    <div class="splash-card">
      <div class="card-main-view" id="mainView">
        <h1 class="splash-title">COSMIC-S</h1>
        <a href="https://cosmic-seea.neocities.org/Home" class="enter-btn">ENTER -&gt;</a>
      </div>
    </div>

    <!-- AVATAR IN BASSO A DESTRA DELLA CARD -->
    <img src="./Avatar.png" alt="Avatar Cosmic-S" class="interactive-avatar">

  </div>

</body>
</html>
