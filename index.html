<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COSMIC-S</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      overflow-x: hidden;
    }

    .scene-wrapper {
      position: relative;
      width: 100%;
      max-width: 580px;
      height: 420px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .notebook-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: none;
      box-shadow: none;
    }

    /* Animazione di movimento fluttuante per i timbri */
    @keyframes floatAround {
      0% { transform: translateY(0px) rotate(var(--rot)); }
      50% { transform: translateY(-6px) translateX(4px) rotate(calc(var(--rot) + 2deg)); }
      100% { transform: translateY(0px) rotate(var(--rot)); }
    }

    .stamp-sticker {
      position: absolute;
      height: auto;
      z-index: 3;
      pointer-events: none;
      filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.25));
      animation: floatAround 4s ease-in-out infinite;
    }

    /* Assegniamo rotazioni base e tempistiche leggermente diverse per ogni timbro così non si muovono all'unisono */
    .stamp-1  { width: 55px; top: 35px; left: 45px; --rot: -12deg; animation-duration: 4.2s; }
    .stamp-2  { width: 62px; top: 30px; left: 160px; --rot: 8deg; animation-duration: 3.8s; }
    .stamp-3  { width: 50px; top: 35px; right: 50px; --rot: 14deg; animation-duration: 4.5s; }
    .stamp-4  { width: 65px; top: 155px; left: 25px; --rot: 18deg; animation-duration: 5.0s; }
    .stamp-5  { width: 52px; top: 120px; right: 25px; --rot: -15deg; animation-duration: 3.6s; }
    .stamp-6  { width: 58px; bottom: 40px; left: 40px; --rot: -8deg; animation-duration: 4.1s; }
    .stamp-7  { width: 48px; bottom: 45px; left: 150px; --rot: 12deg; animation-duration: 4.7s; }
    .stamp-8  { width: 60px; bottom: 40px; right: 45px; --rot: -10deg; animation-duration: 3.9s; }
    .stamp-9  { width: 54px; top: 75px; left: 15px; --rot: 5deg; animation-duration: 4.3s; }
    .stamp-10 { width: 58px; top: 80px; right: 15px; --rot: -6deg; animation-duration: 4.9s; }
    .stamp-11 { width: 50px; bottom: 85px; left: 20px; --rot: -14deg; animation-duration: 3.7s; }
    .stamp-12 { width: 56px; bottom: 80px; right: 20px; --rot: 16deg; animation-duration: 4.4s; }
    .stamp-13 { width: 62px; top: 5px; left: 260px; --rot: -4deg); animation-duration: 4.6s; }
    .stamp-14 { width: 48px; bottom: 10px; left: 250px; --rot: 7deg; animation-duration: 3.5s; }
    .stamp-15 { width: 55px; top: 180px; right: 15px; --rot: -11deg; animation-duration: 4.8s; }

    .splash-card {
      position: absolute;
      width: 320px;
      height: 220px;
      background: #111111 url('./4e432360601c9df1cab3274448a0fa56.gif') no-repeat center center;
      background-size: cover;
      border: 3px solid #111111;
      border-radius: 28px;
      padding: 30px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 25px;
      overflow: hidden;
      z-index: 2;
    }

    .splash-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1;
    }

    .splash-card > * {
      position: relative;
      z-index: 2;
    }

    .splash-title {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 0 10px rgba(255,255,255,0.9), 0 0 20px rgba(255,255,255,0.6);
    }

    .enter-btn {
      display: block;
      width: 100%;
      background: #ffffff;
      color: #111111;
      border: none;
      border-radius: 16px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .enter-btn:hover {
      background: #f0f0f3;
    }

    /* Post-it interattivo con il colore F3EEDA */
    .update-postit {
      position: absolute;
      top: 35px;
      right: 35px;
      z-index: 4;
      cursor: pointer;
    }

    .postit-tab {
      background: #F3EEDA;
      color: #222222;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 4px;
      box-shadow: 2px 3px 6px rgba(0,0,0,0.2);
      transform: rotate(6deg);
      border: 1px dashed #d5ccb6;
      transition: transform 0.15s ease, background 0.15s ease;
      letter-spacing: 0.5px;
    }

    .postit-tab:hover {
      background: #eae3cc;
      transform: rotate(6deg) scale(1.05);
    }

    .postit-popup {
      position: absolute;
      top: 35px;
      right: 0;
      width: 200px;
      background: #F3EEDA;
      border: 2px solid #d5ccb6;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 3px 5px 12px rgba(0,0,0,0.25);
      transform: rotate(2deg);
      display: none;
      z-index: 5;
      text-align: left;
    }

    .postit-popup.active {
      display: block;
    }

    .postit-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      border-bottom: 1px solid #d5ccb6;
      padding-bottom: 4px;
    }

    .postit-title {
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      color: #333333;
      letter-spacing: 1px;
    }

    .postit-close {
      background: none;
      border: none;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      color: #555555;
    }

    .postit-close:hover {
      color: #000000;
    }

    .postit-content {
      font-size: 0.75rem;
      font-weight: 700;
      color: #222222;
      line-height: 1.3;
    }

    /* Ottimizzazione per smartphone */
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .scene-wrapper {
        height: 360px;
        max-width: 100%;
      }

      .splash-card {
        width: 260px;
        height: 180px;
        padding: 20px 15px;
        gap: 18px;
        border-radius: 22px;
        border-width: 2px;
      }

      .splash-title {
        font-size: 1.8rem;
      }

      .enter-btn {
        padding: 10px;
        font-size: 0.9rem;
        border-radius: 12px;
      }

      .update-postit {
        top: 20px;
        right: 20px;
      }

      .postit-tab {
        font-size: 0.65rem;
        padding: 4px 8px;
      }

      .postit-popup {
        width: 170px;
        top: 25px;
        right: 0;
        padding: 10px;
      }

      .stamp-1  { width: 42px; top: 25px; left: 25px; }
      .stamp-2  { width: 46px; top: 20px; left: 110px; }
      .stamp-3  { width: 38px; top: 25px; right: 30px; }
      .stamp-4  { width: 48px; top: 130px; left: 15px; }
      .stamp-5  { width: 40px; top: 100px; right: 15px; }
      .stamp-6  { width: 44px; bottom: 25px; left: 25px; }
      .stamp-7  { width: 38px; bottom: 30px; left: 105px; }
      .stamp-8  { width: 45px; bottom: 25px; right: 25px; }
      .stamp-9  { width: 40px; top: 60px; left: 10px; }
      .stamp-10 { width: 42px; top: 65px; right: 10px; }
      .stamp-11 { width: 38px; bottom: 65px; left: 12px; }
      .stamp-12 { width: 42px; bottom: 60px; right: 12px; }
      .stamp-13 { width: 46px; top: 5px; left: 180px; }
      .stamp-14 { width: 38px; bottom: 5px; left: 170px; }
      .stamp-15 { width: 42px; top: 150px; right: 10px; }
    }
  </style>
</head>
<body>

  <div class="scene-wrapper">
    <img src="./notebook-spread.png" alt="Notebook Background" class="notebook-bg">

    <div class="update-postit">
      <div class="postit-tab" id="postitTab">𖡎 What's New?</div>
      <div class="postit-popup" id="postitPopup">
        <div class="postit-header">
          <span class="postit-title">Latest Updates</span>
          <button class="postit-close" id="postitClose">✕</button>
        </div>
        <div class="postit-content">
          Ⰶ Added new stamps inspired by 1776! Check them out in the stamps gallery.
        </div>
      </div>
    </div>

    <img src="./stamp-1.png" alt="Stamp 1" class="stamp-sticker stamp-1">
    <img src="./stamp-2.png" alt="Stamp 2" class="stamp-sticker stamp-2">
    <img src="./stamp-3.png" alt="Stamp 3" class="stamp-sticker stamp-3">
    <img src="./stamp-4.png" alt="Stamp 4" class="stamp-sticker stamp-4">
    <img src="./stamp-5.png" alt="Stamp 5" class="stamp-sticker stamp-5">
    <img src="./stamp-6.png" alt="Stamp 6" class="stamp-sticker stamp-6">
    <img src="./stamp-7.png" alt="Stamp 7" class="stamp-sticker stamp-7">
    <img src="./stamp-8.png" alt="Stamp 8" class="stamp-sticker stamp-8">
    <img src="./stamp-9.png" alt="Stamp 9" class="stamp-sticker stamp-9">
    <img src="./stamp-10.png" alt="Stamp 10" class="stamp-sticker stamp-10">
    <img src="./stamp-11.png" alt="Stamp 11" class="stamp-sticker stamp-11">
    <img src="./stamp-12.png" alt="Stamp 12" class="stamp-sticker stamp-12">
    <img src="./stamp-13.png" alt="Stamp 13" class="stamp-sticker stamp-13">
    <img src="./stamp-14.png" alt="Stamp 14" class="stamp-sticker stamp-14">
    <img src="./stamp-15.png" alt="Stamp 15" class="stamp-sticker stamp-15">

    <div class="splash-card">
      <h1 class="splash-title">COSMIC-S</h1>
      <a href="https://seea-star.github.io/Cosmic-S-Home/" class="enter-btn">ENTER →</a>
    </div>
  </div>

  <script>
    const tab = document.getElementById('postitTab');
    const popup = document.getElementById('postitPopup');
    const closeBtn = document.getElementById('postitClose');

    tab.addEventListener('click', (e) => {
      e.stopPropagation();
      popup.classList.toggle('active');
    });

    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      popup.classList.remove('active');
    });

    document.addEventListener('click', (e) => {
      if (!popup.contains(e.target) && e.target !== tab) {
        popup.classList.remove('active');
      }
    });
  </script>

</body>
</html>
