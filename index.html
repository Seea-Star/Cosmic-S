<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COSMIC-S</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      overflow-x: hidden;
    }

    /* Struttura principale con dimensioni fisse */
    .scene-wrapper {
      position: relative;
      width: 520px;
      height: 380px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Immagine del quaderno senza ombra */
    .notebook-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: none;
      box-shadow: none;
    }

    /* Stile comune per i 10 timbri/sticker */
    .stamp-sticker {
      position: absolute;
      width: 65px;
      height: auto;
      z-index: 3;
      pointer-events: none;
      filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.25));
    }

    /* Posizioni e rotazioni uniche per tutti i 10 timbri */
    .stamp-1 { top: 15px; left: 20px; transform: rotate(-12deg); }
    .stamp-2 { top: 8px; right: 25px; transform: rotate(14deg); }
    .stamp-3 { bottom: 15px; left: 15px; transform: rotate(8deg); }
    .stamp-4 { bottom: 10px; right: 20px; transform: rotate(-15deg); }
    .stamp-5 { top: 45px; left: -10px; transform: rotate(-6deg); }
    .stamp-6 { top: 50px; right: -10px; transform: rotate(9deg); }
    .stamp-7 { bottom: 55px; left: -5px; transform: rotate(12deg); }
    .stamp-8 { bottom: 50px; right: -5px; transform: rotate(-10deg); }
    .stamp-9 { top: -5px; left: 140px; transform: rotate(5deg); }
    .stamp-10 { bottom: -5px; right: 150px; transform: rotate(-8deg); }

    /* Box nero centrale senza alcuna ombra */
    .splash-card {
      position: absolute;
      width: 320px;
      height: 220px;
      background: #111111 url('./4e432360601c9df1cab3274448a0fa56.gif') no-repeat center center;
      background-size: cover;
      border: 3px solid #111111;
      border-radius: 28px;
      padding: 30px 20px;
      box-shadow: none;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 25px;
      overflow: hidden;
      z-index: 2;
    }

    .splash-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1;
    }

    .splash-card > * {
      position: relative;
      z-index: 2;
    }

    .splash-title {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 0 10px rgba(255,255,255,0.9), 0 0 20px rgba(255,255,255,0.6);
    }

    .enter-btn {
      display: block;
      width: 100%;
      background: #ffffff;
      color: #111111;
      border: none;
      border-radius: 16px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .enter-btn:hover {
      background: #f0f0f3;
    }
  </style>
</head>
<body>

  <div class="scene-wrapper">
    <!-- Immagine del quaderno -->
    <img src="./notebook-spread.png" alt="Notebook Background" class="notebook-bg">

    <!-- I 10 timbri disposti attorno al box -->
    <img src="./stamp-1.png" alt="Stamp 1" class="stamp-sticker stamp-1">
    <img src="./stamp-2.png" alt="Stamp 2" class="stamp-sticker stamp-2">
    <img src="./stamp-3.png" alt="Stamp 3" class="stamp-sticker stamp-3">
    <img src="./stamp-4.png" alt="Stamp 4" class="stamp-sticker stamp-4">
    <img src="./stamp-5.png" alt="Stamp 5" class="stamp-sticker stamp-5">
    <img src="./stamp-6.png" alt="Stamp 6" class="stamp-sticker stamp-6">
    <img src="./stamp-7.png" alt="Stamp 7" class="stamp-sticker stamp-7">
    <img src="./stamp-8.png" alt="Stamp 8" class="stamp-sticker stamp-8">
    <img src="./stamp-9.png" alt="Stamp 9" class="stamp-sticker stamp-9">
    <img src="./stamp-10.png" alt="Stamp 10" class="stamp-sticker stamp-10">

    <!-- Box nero centrale senza ombre -->
    <div class="splash-card">
      <h1 class="splash-title">COSMIC-S</h1>
      <a href="https://seea-star.github.io/Cosmic-S-Home/" class="enter-btn">ENTER →</a>
    </div>
  </div>

</body>
</html>
