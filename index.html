<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COSMIC-S</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      overflow: hidden;
      position: relative;
    }

    /* Contenitore centrale del quaderno, card e post-it (z-index basso) */
    .scene-wrapper {
      position: relative;
      width: 100%;
      max-width: 580px;
      height: 420px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1;
    }

    .notebook-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: none;
      box-shadow: none;
      z-index: 1;
    }

    .splash-card {
      position: absolute;
      width: 320px;
      height: 220px;
      background: #111111 url('./4e432360601c9df1cab3274448a0fa56.gif') no-repeat center center;
      background-size: cover;
      border: 3px solid #111111;
      border-radius: 28px;
      padding: 30px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 25px;
      overflow: hidden;
      z-index: 2;
    }

    .splash-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1;
    }

    .splash-card > * {
      position: relative;
      z-index: 2;
    }

    .splash-title {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 0 10px rgba(255,255,255,0.9), 0 0 20px rgba(255,255,255,0.6);
    }

    .enter-btn {
      display: block;
      width: 100%;
      background: #ffffff;
      color: #111111;
      border: none;
      border-radius: 16px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .enter-btn:hover {
      background: #f0f0f3;
    }

    /* Post-it interattivo posizionato di nuovo dentro il quaderno, ma al livello PIÙ ALTO ASSOLUTO (sopra i timbri) */
    .update-postit {
      position: absolute;
      top: 35px;
      right: 35px;
      z-index: 20;
      cursor: pointer;
    }

    .postit-tab {
      background: #F3EEDA;
      color: #222222;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 4px;
      box-shadow: 2px 3px 6px rgba(0,0,0,0.2);
      transform: rotate(6deg);
      border: 1px dashed #d5ccb6;
      transition: transform 0.15s ease, background 0.15s ease;
      letter-spacing: 0.5px;
    }

    .postit-tab:hover {
      background: #eae3cc;
      transform: rotate(6deg) scale(1.05);
    }

    .postit-popup {
      position: absolute;
      top: 35px;
      right: 0;
      width: 200px;
      background: #F3EEDA;
      border: 2px solid #d5ccb6;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 3px 5px 12px rgba(0,0,0,0.25);
      transform: rotate(2deg);
      display: none;
      z-index: 25;
      text-align: left;
    }

    .postit-popup.active {
      display: block;
    }

    .postit-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      border-bottom: 1px solid #d5ccb6;
      padding-bottom: 4px;
    }

    .postit-title {
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      color: #333333;
      letter-spacing: 1px;
    }

    .postit-close {
      background: none;
      border: none;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      color: #555555;
    }

    .postit-close:hover {
      color: #000000;
    }

    .postit-content {
      font-size: 0.75rem;
      font-weight: 700;
      color: #222222;
      line-height: 1.3;
    }

    /* I timbri riportati dentro al quaderno con le loro posizioni e livelli originali */
    .stamp-sticker {
      position: absolute;
      height: auto;
      z-index: 3;
      pointer-events: none;
      filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.25));
    }

    .stamp-1  { width: 55px; top: 35px; left: 45px; transform: rotate(-12deg); }
    .stamp-2  { width: 62px; top: 30px; left: 160px; transform: rotate(8deg); }
    .stamp-3  { width: 50px; top: 35px; right: 50px; transform: rotate(14deg); }
    .stamp-4  { width: 65px; top: 155px; left: 25px; transform: rotate(18deg); }
    .stamp-5  { width: 52px; top: 120px; right: 25px; transform: rotate(-15deg); }
    .stamp-6  { width: 58px; bottom: 40px; left: 40px; transform: rotate(-8deg); }
    .stamp-7  { width: 48px; bottom: 45px; left: 150px; transform: rotate(12deg); }
    .stamp-8  { width: 60px; bottom: 40px; right: 45px; transform: rotate(-10deg); }
    .stamp-9  { width: 54px; top: 75px; left: 15px; transform: rotate(5deg); }
    .stamp-10 { width: 58px; top: 80px; right: 15px; transform: rotate(-6deg); }
    .stamp-11 { width: 50px; bottom: 85px; left: 20px; transform: rotate(-14deg); }
    .stamp-12 { width: 56px; bottom: 80px; right: 20px; transform: rotate(16deg); }
    .stamp-13 { width: 62px; top: 5px; left: 260px; transform: rotate(-4deg); }
    .stamp-14 { width: 48px; bottom: 10px; left: 250px; transform: rotate(7deg); }
    .stamp-15 { width: 55px; top: 180px; right: 15px; transform: rotate(-11deg); }

    /* Ottimizzazione per smartphone */
    @media (max-width: 600px) {
      .scene-wrapper {
        height: 360px;
        max-width: 100%;
      }

      .splash-card {
        width: 260px;
        height: 180px;
        padding: 20px 15px;
        gap: 18px;
        border-radius: 22px;
        border-width: 2px;
      }

      .splash-title {
        font-size: 1.8rem;
      }

      .enter-btn {
        padding: 10px;
        font-size: 0.9rem;
        border-radius: 12px;
      }

      .update-postit {
        top: 20px;
        right: 20px;
      }

      .postit-tab {
        font-size: 0.65rem;
