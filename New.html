<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COSMIC-S</title>
  <link rel="icon" type="image/png" href="https://cosmic-seea.neocities.org/stamp-5.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'Starshines';
      src: url('https://seea-star.github.io/Fonts/Starshines.otf') format('opentype');
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      overflow-y: auto;
      position: relative;
    }

    .scene-wrapper {
      position: relative;
      width: 860px;
      height: 620px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1;
      flex-shrink: 0;
    }

    /* CARD NERA FISSA SENZA EFFETTI SUL RETTANGOLO */
    .splash-card {
      position: relative;
      width: 340px;
      height: 200px;
      background: #111111 url('https://raw.githubusercontent.com/Seea-Star/Cosmic-S/refs/heads/main/4e432360601c9df1cab3274448a0fa56.gif') no-repeat center center;
      background-size: cover;
      border: 3px solid #F3EEDA;
      border-radius: 28px;
      padding: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      z-index: 6;
      box-shadow: 4px 4px 0px #F3EEDA, 0 0 20px rgba(0, 0, 0, 0.2);
      text-decoration: none;
      cursor: pointer;
    }

    .splash-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1;
    }

    .splash-card > * {
      position: relative;
      z-index: 2;
    }

    .card-main-view {
      font-family: 'Starshines', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    /* SOLO IL TESTO BRILLA E SI INGRANDISCE */
    .splash-title {
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #ffffff;
      line-height: 1;
      white-space: nowrap;
      text-shadow: 0 0 14px rgba(255,255,255,1), 0 0 28px rgba(255,255,255,0.8), 0 0 40px rgba(255,255,255,0.4);
      transition: all 0.3s ease;
    }

    .splash-card:hover .splash-title {
      color: #F3EEDA;
      text-shadow: 0 0 18px rgba(243, 238, 218, 1), 0 0 35px rgba(255, 255, 255, 1), 0 0 55px rgba(243, 238, 218, 0.8);
      transform: scale(1.05);
    }

    /* DIARIO (DESKTOP) */
    .interactive-diary {
      position: absolute;
      top: 15px;
      left: 180px;
      width: 175px;
      height: auto;
      z-index: 12;
      cursor: pointer;
      transform: rotate(12deg);
      transition: transform 0.35s cubic-bezier(0.25, 1.3, 0.5, 1), filter 0.3s ease;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.35));
    }

    .interactive-diary:hover,
    .interactive-diary:active {
      transform: rotate(0deg) scale(1.06);
      filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.95)) drop-shadow(0 0 25px rgba(243, 238, 218, 0.85));
    }

    /* AVATAR IN BASSO A DESTRA */
    @keyframes floatAvatar {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }

    .interactive-avatar {
      position: absolute;
      bottom: -15px;
      right: 50px;
      width: 290px;
      height: auto;
      z-index: 10;
      cursor: pointer;
      animation: floatAvatar 4.5s ease-in-out infinite;
      transition: filter 0.3s ease, transform 0.3s ease;
      filter: drop-shadow(2px 4px 12px rgba(0,0,0,0.45)) drop-shadow(0 0 15px rgba(255, 255, 255, 0.6));
    }

    .interactive-avatar:hover,
    .interactive-avatar:active {
      filter: drop-shadow(0 0 25px rgba(255, 255, 255, 1)) drop-shadow(0 0 40px rgba(243, 238, 218, 1));
    }

    /* TIMBRI SPARSI */
    @keyframes floatStamps {
      0% { transform: translateY(0px) rotate(var(--base-rot)); }
      50% { transform: translateY(-6px) rotate(calc(var(--base-rot) + 2deg)); }
      100% { transform: translateY(0px) rotate(var(--base-rot)); }
    }

    .stamp-sticker {
      position: absolute;
      height: auto;
      z-index: 5;
      pointer-events: none;
      filter: drop-shadow(3px 3px 6px rgba(0,0,0,0.25));
      animation: floatStamps 4s ease-in-out infinite;
    }

    .stamp-1  { width: 62px;  top: 10%;    left: 4%;    --base-rot: 19deg;   animation-delay: 0s; }
    .stamp-5  { width: 74px;  bottom: 8%;  left: 18%;   --base-rot: -14deg;  animation-delay: 0.5s; }
    .stamp-8  { width: 84px;  top: 4%;     right: 12%;  --base-rot: -24deg;  animation-delay: 1.2s; }
    .stamp-4  { width: 78px;  bottom: 4%;  right: 6%;   --base-rot: 22deg;   animation-delay: 1.8s; }

    /* SEGNAPOSTO DOODLE */
    .doodle-placeholder {
      position: absolute;
      width: 30px;
      height: 30px;
      border: 2px dashed rgba(0, 0, 0, 0.2);
      border-radius: 6px;
      z-index: 4;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.15);
    }
    .doodle-1 { top: 32%; left: 18%; transform: rotate(-12deg); }
    .doodle-2 { top: 18%; right: 32%; transform: rotate(16deg); }
    .doodle-3 { bottom: 35%; left: 22%; transform: rotate(10deg); }
    .doodle-4 { bottom: 22%; right: 35%; transform: rotate(-18deg); }
    .doodle-5 { top: 52%; left: 6%;  transform: rotate(7deg); }
    .doodle-6 { top: 28%; right: 6%;  transform: rotate(-9deg); }

    /* ADATTAMENTO MOBILE */
    @media (max-width: 600px) {
      .scene-wrapper {
        width: 100%;
        height: 540px;
      }

      .splash-card {
        width: 270px;
        height: 155px;
      }

      .splash-title { 
        font-size: 1.9rem;
      }

      .interactive-diary {
        width: 125px;
        top: 25px; /* Spostato più in basso rispetto a prima per telefoni */
        left: 20px;
      }

      .interactive-avatar {
        width: 210px;
        bottom: -25px;
        right: 15px;
      }

      .stamp-1 { width: 45px; top: 8%; left: 2%; }
      .stamp-5 { width: 50px; bottom: 6%; left: 8%; }
      .stamp-8 { width: 55px; top: 2%; right: 6%; }
      .stamp-4 { width: 52px; bottom: 2%; right: 4%; }
    }
  </style>
</head>
<body>

  <!-- TIMBRI -->
  <img src="https://cosmic-seea.neocities.org/stamp-7.png" alt="Stamp 1" class="stamp-sticker stamp-1">
  <img src="https://cosmic-seea.neocities.org/stamp-4.png" alt="Stamp 5" class="stamp-sticker stamp-5">
  <img src="https://raw.githubusercontent.com/Seea-Star/Cosmic-S/refs/heads/main/stamp-8.png" alt="Stamp 8" class="stamp-sticker stamp-8">
  <img src="https://cosmic-seea.neocities.org/stamp-6.png" alt="Stamp 4" class="stamp-sticker stamp-4">

  <!-- SEGNAPOSTO DOODLE -->
  <div class="doodle-placeholder doodle-1"></div>
  <div class="doodle-placeholder doodle-2"></div>
  <div class="doodle-placeholder doodle-3"></div>
  <div class="doodle-placeholder doodle-4"></div>
  <div class="doodle-placeholder doodle-5"></div>
  <div class="doodle-placeholder doodle-6"></div>

  <div class="scene-wrapper">

    <!-- CARD NERA CENTRALE INTERATTIVA -->
    <a href="https://cosmic-seea.neocities.org/Home" class="splash-card">
      <div class="card-main-view" id="mainView">
        <h1 class="splash-title">COSMIC-S</h1>
      </div>
    </a>

    <!-- DIARIO VICINO ALLA CARD -->
    <img src="https://raw.githubusercontent.com/Seea-Star/Cosmic-S/refs/heads/main/Diary.png" alt="Diario" class="interactive-diary">

    <!-- AVATAR IN BASSO A DESTRA -->
    <img src="https://raw.githubusercontent.com/Seea-Star/Cosmic-S/refs/heads/main/Avatar.png" alt="Avatar Cosmic-S" class="interactive-avatar">

  </div>

</body>
</html>
